<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GUB CSE — Thesis/Project Board Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#15201a; --paper:#f6f4ec; --card:#fffdf7; --line:#d9d2c2;
    --moss:#2f5d45; --moss-700:#234a36; --moss-100:#e3ede6;
    --clay:#b4552d; --clay-100:#f3e2d8;
    --gold:#b8893a; --muted:#6c6557;
    --shadow:0 1px 2px rgba(20,32,26,.06),0 8px 24px rgba(20,32,26,.06);
    --r:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    -webkit-font-smoothing:antialiased;}
  .ui{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;}
  a{color:var(--moss-700)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}

  /* top bar */
  .top{position:sticky;top:0;z-index:30;background:rgba(246,244,236,.86);
    backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--line)}
  .top .row{display:flex;align-items:center;gap:18px;height:66px}
  .mark{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.2px}
  .mark .logo{width:38px;height:38px;border-radius:10px;flex:0 0 38px;
    background:linear-gradient(145deg,#3c714f,#1f4630);
    display:grid;place-items:center;box-shadow:0 2px 6px rgba(31,70,48,.28),inset 0 1px 0 rgba(255,255,255,.18)}
  .mark .logo svg{display:block}
  .mark small{display:block;font:500 11px/1 ui-sans-serif;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
  .seg{margin-left:auto;display:flex;background:var(--moss-100);border:1px solid var(--line);
    border-radius:999px;padding:4px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--moss-700);
    padding:7px 16px;border-radius:999px;font:600 13px/1 ui-sans-serif}
  .seg button.on{background:var(--moss);color:#fff;box-shadow:var(--shadow)}
  .reset-mini{display:none} /* desktop: full "Reset data" label; mobile media query flips this */
  .saveflag{font:600 12px/1 ui-sans-serif;color:var(--muted)}

  /* generic */
  h1,h2,h3{font-weight:600;letter-spacing:-.01em;margin:0}
  .eyebrow{font:600 11px/1 ui-sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--clay)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:22px}
  .muted{color:var(--muted)}
  .btn{border:1px solid var(--moss);background:var(--moss);color:#fff;border-radius:10px;
    padding:10px 18px;font:600 14px/1 ui-sans-serif}
  .btn:hover{background:var(--moss-700)}
  .btn.ghost{background:transparent;color:var(--moss-700)}
  .btn.ghost:hover{background:var(--moss-100)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .pill{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 ui-sans-serif;
    padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#fff}
  .pill.thesis{background:var(--moss-100);border-color:#bcd3c3;color:var(--moss-700)}
  .pill.project{background:var(--clay-100);border-color:#e6c3ad;color:var(--clay)}
  .tier{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;
    font:800 11px/1 ui-sans-serif;color:#fff}
  .tA{background:#234a36}.tB{background:#3c714f}.tC{background:#b8893a}.tD{background:#9a8f78}

  /* wizard */
  .steps{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 26px}
  .step{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:10px;
    border:1px solid var(--line);background:#fff;font:600 12.5px/1 ui-sans-serif;color:var(--muted)}
  .step .n{width:20px;height:20px;border-radius:6px;background:var(--line);color:#fff;
    display:grid;place-items:center;font-size:11px}
  .step.on{border-color:var(--moss);color:var(--moss-700);background:var(--moss-100)}
  .step.on .n{background:var(--moss)}
  .step.done .n{background:var(--gold)}

  .drop{border:1.5px dashed #c4bba6;border-radius:12px;padding:34px;text-align:center;background:#fffef9}
  .drop.hot{border-color:var(--moss);background:var(--moss-100)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);font-size:13.5px}
  th{font:600 11px/1 ui-sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font:600 12px/1 ui-sans-serif;color:var(--muted);letter-spacing:.04em}
  .field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .tierbox{min-height:120px}
  .tierbox h4{margin:0 0 8px;font:700 12px/1 ui-sans-serif}
  .chip{display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:6px;font-size:12.5px}
  .chip select{border:0;background:var(--paper);border-radius:6px;padding:3px 5px;font-size:11px}
  .xbtn{border:1px solid var(--line);background:#fff;color:var(--clay);width:22px;height:22px;border-radius:6px;
    font:700 14px/1 ui-sans-serif;display:grid;place-items:center;margin-left:4px}
