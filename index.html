const TypePill = ({t})=> <span className={"pill "+(t==="Thesis"?"thesis":"project")}>{t}</span>;

function Stat({n,label}){ return <div className="stat"><b>{n}</b><span className="muted ui">{label}</span></div>; }

/* =======================================================================
   ADMIN  WIZARD
   ======================================================================= */
function Admin({store,setStore,onExit,saveState,visible,onToggleVisible,onRename}){
  // The semester is already chosen (via SemesterPicker) before Admin mounts,
  // so we start at the first real step. Step is remembered in the store.
  const [step,setStep]=useState(()=> store.adminStep && store.adminStep>=1 ? store.adminStep : 1);
  const steps=["Import groups","Faculty & tiers","Board config","Slots & dates","Generate"];

  const goStep=(n)=>{ setStep(n); setStore(s=>({...s,adminStep:n})); };

  // --- rename (display name only; the slug / student link never changes) ---
  const [editingName,setEditingName]=useState(false);
  const [nameDraft,setNameDraft]=useState(store.semester||"");
  const [renaming,setRenaming]=useState(false);
  const commitRename=async ()=>{
    const nm=nameDraft.trim();
    if(!nm || nm===store.semester){ setEditingName(false); setNameDraft(store.semester||""); return; }
    setRenaming(true);
    const ok=await onRename(nm);
    setRenaming(false);
    if(ok){ setStore(s=>({...s,semester:nm})); setEditingName(false); }
    else { setNameDraft(store.semester||""); }
  };

  return (
    <div className="wrap" style={{padding:"26px 22px 80px"}}>
      <div className="eyebrow">Admin workspace</div>
      <h1 style={{fontSize:30,margin:"6px 0 2px"}}>Defense board builder</h1>
      <div style={{marginTop:4,display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
        {editingName ? (
          <span style={{display:"inline-flex",alignItems:"center",gap:8}}>
            <input autoFocus value={nameDraft} disabled={renaming}
              onChange={e=>setNameDraft(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter") commitRename(); if(e.key==="Escape"){ setEditingName(false); setNameDraft(store.semester||""); } }}
              style={{fontSize:14,padding:"6px 10px"}} />
            <button className="btn" style={{padding:"7px 12px",fontSize:13}} onClick={commitRename} disabled={renaming||!nameDraft.trim()}>{renaming?"Saving…":"Save"}</button>
            <button className="linkbtn" onClick={()=>{ setEditingName(false); setNameDraft(store.semester||""); }}>Cancel</button>
          </span>
        ) : (
          <span className="muted ui" style={{display:"inline-flex",alignItems:"center",gap:8}}>
            Semester: <b>{store.semester}</b>
            <button className="linkbtn" onClick={()=>{ setNameDraft(store.semester||""); setEditingName(true); }}>rename</button>
          </span>
        )}
        <button className="linkbtn" onClick={onExit}>← All semesters</button>
        <label className="ui" style={{display:"inline-flex",alignItems:"center",gap:7,fontSize:13,marginLeft:"auto",cursor:"pointer"}}>
          <input type="checkbox" checked={!!visible} onChange={e=>onToggleVisible(e.target.checked)} />
          Visible to students
        </label>
        <span className="saveflag">{saveState}</span>
      </div>

      <div className="steps" style={{marginTop:18}}>
        {steps.map((s,i)=>(
          <div key={s} className={"step "+(step===i+1?"on":step>i+1?"done":"")} onClick={()=>goStep(i+1)}>
            <span className="n">{i+1}</span>{s}
          </div>
        ))}
      </div>

      {step===1 && <StepImport store={store} setStore={setStore} next={()=>goStep(2)} />}
      {step===2 && <StepTiers store={store} setStore={setStore} next={()=>goStep(3)} />}
      {step===3 && <StepConfig store={store} setStore={setStore} next={()=>goStep(4)} />}
      {step===4 && <StepSlots store={store} setStore={setStore} next={()=>goStep(5)} />}
      {step===5 && <StepGenerate store={store} setStore={setStore} />}
    </div>
  );
}

function StepImport({store,setStore,next}){
  const [hot,setHot]=useState(false);
  const [warnings,setWarnings]=useState([]);
  const [fileName,setFileName]=useState("");
  const inputRef=useRef();
  const onlyConfirmed=store.onlyConfirmed;

  const handleSheets=useCallback((sheets,fname)=>{
    const {groups,warnings}=parseWorkbook(sheets,{onlyConfirmed});
    setWarnings(warnings);
    setFileName(fname||"");
    setStore(s=>({...s,groups,rawSheets:sheets}));
  },[onlyConfirmed,setStore]);

  const parse=useCallback((file)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const wb=XLSX.read(e.target.result,{type:"array"});
      const sheets=wb.SheetNames.map(name=>({
        name,
        rows:XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:""}),
      }));
      handleSheets(sheets,file.name);
    };
    reader.readAsArrayBuffer(file);
  },[handleSheets]);

  // Re-parse when the confirmed-only toggle changes and we have raw sheets.
  const reparse=(flag)=>{
    setStore(s=>{
      const next={...s,onlyConfirmed:flag};
      if(s.rawSheets){ const {groups,warnings}=parseWorkbook(s.rawSheets,{onlyConfirmed:flag});
        setWarnings(warnings); next.groups=groups; }
      return next;
    });
  };

  // Per-cell breakdown for the loaded groups.
  const cellCounts={};
  for(const g of store.groups){ const k=inferGroupCell(g).cell||"—"; cellCounts[k]=(cellCounts[k]||0)+1; }
  const unresolvedSup=[...new Set(store.groups.flatMap(g=>[g.supervisor,g.coSupervisor])
    .filter(Boolean).filter(n=>!resolveFaculty(n)))];

  return (
    <div className="card pad">
      <h2 style={{fontSize:20}}>Step 1 · Import student groups</h2>
      <p className="note" style={{marginTop:6,marginBottom:16}}>
        Upload the Google-Forms proposal workbook (one sheet per research cell). The research cell comes
        from each sheet name; multi-student groups that span several rows are reassembled automatically.
        You don't need a cell column or a single flat sheet.
      </p>

      <div className={"drop"+(hot?" hot":"")}
        onDragOver={e=>{e.preventDefault();setHot(true);}}
        onDragLeave={()=>setHot(false)}
        onDrop={e=>{e.preventDefault();setHot(false); if(e.dataTransfer.files[0])parse(e.dataTransfer.files[0]);}}>
        <div className="ui" style={{fontWeight:600,marginBottom:6}}>Drop the proposal workbook here</div>
        <div className="note" style={{marginBottom:14}}>.xlsx with one tab per cell — or —</div>
        <button className="btn" onClick={()=>inputRef.current.click()}>Choose file</button>
        <input ref={inputRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}}
          onChange={e=>e.target.files[0]&&parse(e.target.files[0])} />
        {fileName && <div className="note" style={{marginTop:12}}>Loaded: <b>{fileName}</b></div>}
      </div>

      <label className="ui" style={{display:"flex",alignItems:"center",gap:8,marginTop:14,fontSize:13,color:"var(--muted)"}}>
        <input type="checkbox" checked={!!onlyConfirmed} onChange={e=>reparse(e.target.checked)} />
        Only include groups marked <b>Confirmed = Yes</b>
      </label>

      {warnings.length>0 && (
        <div className="banner" style={{background:"#fdf6f1",borderColor:"#e6c3ad",color:"var(--clay)",marginTop:14}}>
          {warnings.map((w,i)=><div key={i}>⚠ {w}</div>)}
        </div>
      )}

      {store.groups.length>0 && (
        <div style={{marginTop:18}}>
          <div className="toolbar">
            <Stat n={store.groups.length} label="groups" />
            <Stat n={store.groups.filter(g=>g.type==="Thesis").length} label="thesis" />
            <Stat n={store.groups.filter(g=>g.type==="Project").length} label="project" />
            <button className="btn" style={{marginLeft:"auto"}} onClick={next}>Continue →</button>
          </div>

          <div className="ui" style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
            {Object.entries(cellCounts).map(([c,n])=>(
              <span key={c} className="pill">{CELL_SHORT[c]||c}: {n}</span>
            ))}
          </div>

          {unresolvedSup.length>0 && (
            <div className="banner" style={{background:"#fdf6f1",borderColor:"#e6c3ad",color:"var(--clay)"}}>
              <b>{unresolvedSup.length} supervisor name(s) not in roster</b> — these groups still place by sheet/cell,
              but COI can't be checked for them: {unresolvedSup.join(", ")}.
            </div>
          )}

          <div style={{overflowX:"auto"}}>
            <table>
              <thead><tr><th>Group</th><th>Type</th><th>Title</th><th>Students</th><th>Supervisor</th><th>Cell</th></tr></thead>
              <tbody>
                {store.groups.map(g=>{
                  const info=inferGroupCell(g);
                  const supOk=!g.supervisor||resolveFaculty(g.supervisor);
                  return (
                    <tr key={g.groupId}>
                      <td><b className="ui">{g.groupId}</b></td>
                      <td><TypePill t={g.type}/></td>
                      <td>{g.title}</td>
                      <td className="muted" style={{fontSize:12}}>{(g.students||[]).join(", ")||"—"}</td>
                      <td style={{color:supOk?"inherit":"var(--clay)"}}>{g.supervisor||"—"}{g.coSupervisor?` · ${g.coSupervisor}`:""}</td>
                      <td>{info.cell? <span className="pill">{CELL_SHORT[info.cell]} · {info.family}</span>
                        : <span className="pill" style={{color:"var(--clay)",borderColor:"#e6c3ad"}}>unresolved</span>}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function StepTiers({store,setStore,next}){
  const roster=store.faculty;                 // runtime roster (add/remove persists here)
  const overrides=store.tierOverrides;        // per-id tier edits
  const tierOf=(f)=> Object.prototype.hasOwnProperty.call(overrides,f.id) ? overrides[f.id] : f.tier;
  const setTier=(fid,t)=>setStore(s=>({...s,tierOverrides:{...s.tierOverrides,[fid]:(t||null)}}));
  const removeFac=(fid)=>setStore(s=>({...s,faculty:s.faculty.filter(f=>f.id!==fid)}));

  const buckets={A:[],B:[],C:[],D:[],U:[]};
  roster.forEach(f=>{ const t=tierOf(f); buckets[t==="A"||t==="B"||t==="C"||t==="D"?t:"U"].push(f); });
  const titles={A:"Group A",B:"Group B",C:"Group C",D:"Group D",U:"Unassigned"};
  const subtitle={A:"most senior in pairing",B:"",C:"",D:"most junior in pairing",U:"not eligible as evaluator"};

  // add-faculty form
  const [nf,setNf]=useState({name:"",cell:"AIML",tier:"D"});
  const addFac=()=>{
    const name=nf.name.trim(); if(!name)return;
    const id="F-NEW-"+Date.now().toString(36);
    setStore(s=>({...s,
      faculty:[...s.faculty,{id,name,designation:"(added)",cell:nf.cell,tier:nf.tier}],
    }));
    setNf({name:"",cell:nf.cell,tier:nf.tier});
  };

  return (
    <div className="card pad">
      <h2 style={{fontSize:20}}>Step 2 · Faculty roster &amp; seniority tiers</h2>
      <p className="note" style={{marginTop:6,marginBottom:8}}>
        Tiers below are pre-set to the department's A/B/C/D grouping. This is a board-balancing grouping,
        not academic rank. Move anyone between groups, send them to <b>Unassigned</b> (kept on the roster
        but never picked as an evaluator), remove them, or add a new faculty member.
      </p>
      <div className="banner ui">
        Pairing for a 2-evaluator board: <b>A+D</b> → <b>B+D</b> → <b>A+C</b> → <b>B+C</b> → any two.
        Each board is tagged with the pairing it used. Unassigned faculty are skipped.
      </div>

      <div className="grid4" style={{marginBottom:14}}>
        {["A","B","C","D"].map(t=>(
          <div key={t} className="card tierbox pad" style={{boxShadow:"none"}}>
            <h4 className="ui"><TierBadge t={t}/> &nbsp;{titles[t]} <span className="muted">({buckets[t].length})</span></h4>
            {subtitle[t] && <div className="note" style={{marginTop:-4,marginBottom:8,fontSize:10}}>{subtitle[t]}</div>}
            {buckets[t].map(f=>(
              <div className="chip" key={f.id}>
                <span style={{flex:1}}>{f.name.replace(/^(Mr\.|Mrs\.|Ms\.|Prof\. Dr\.|Dr\.) /,"")}<br/>
                  <span className="muted" style={{fontSize:10}}>{CELL_SHORT[f.cell]||f.cell}</span></span>
                <select value={tierOf(f)||"U"} onChange={e=>setTier(f.id,e.target.value==="U"?null:e.target.value)}>
                  <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="U">Unassigned</option>
                </select>
                <button className="xbtn" title="Remove" onClick={()=>removeFac(f.id)}>×</button>
              </div>
            ))}
          </div>
        ))}
      </div>

      {/* Unassigned bucket (full width) */}
      <div className="card pad" style={{boxShadow:"none",borderColor:"#e6c3ad",background:"#fdf6f1",marginBottom:14}}>
        <h4 className="ui" style={{color:"var(--clay)"}}>Unassigned <span className="muted">({buckets.U.length})</span>
          <span className="note" style={{fontWeight:400}}> — on the roster, eligible as supervisor for COI, but never selected as an evaluator until tiered.</span></h4>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:8}}>
          {buckets.U.length===0 && <span className="note">No unassigned faculty.</span>}
          {buckets.U.map(f=>(
            <div className="chip" key={f.id} style={{width:240}}>
              <span style={{flex:1}}>{f.name.replace(/^(Mr\.|Mrs\.|Ms\.|Prof\. Dr\.|Dr\.) /,"")}<br/>
                <span className="muted" style={{fontSize:10}}>{CELL_SHORT[f.cell]||f.cell}</span></span>
              <select value="U" onChange={e=>setTier(f.id,e.target.value==="U"?null:e.target.value)}>
                <option value="U">—</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
              </select>
              <button className="xbtn" title="Remove" onClick={()=>removeFac(f.id)}>×</button>
            </div>
          ))}
        </div>
      </div>

      {/* Add faculty */}
      <div className="card pad" style={{boxShadow:"none"}}>
        <h4 className="ui" style={{marginBottom:10}}>Add a faculty member</h4>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div className="field" style={{flex:2,minWidth:200}}>
            <label>Name</label>
            <input value={nf.name} placeholder="e.g. Mr. Kazi Hasnayeen Emad"
              onChange={e=>setNf({...nf,name:e.target.value})}
              onKeyDown={e=>e.key==="Enter"&&addFac()}/>
          </div>
          <div className="field" style={{minWidth:150}}>
            <label>Research cell</label>
            <select value={nf.cell} onChange={e=>setNf({...nf,cell:e.target.value})}>
              {Object.keys(CELL_SHORT).map(c=><option key={c} value={c}>{CELL_SHORT[c]}</option>)}
            </select>
          </div>
          <div className="field" style={{minWidth:120}}>
            <label>Tier</label>
            <select value={nf.tier} onChange={e=>setNf({...nf,tier:e.target.value})}>
              <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="">Unassigned</option>
            </select>
          </div>
          <button className="btn" onClick={addFac}>+ Add</button>
        </div>
        <p className="note" style={{marginTop:10}}>
          The cell determines which family's boards this person can evaluate (F1 = AI/NLP/CV/Bio, F2 = Green/Cyber, F3 = OR).
        </p>
      </div>

      <div className="toolbar">
        <button className="btn ghost" onClick={()=>setStore(s=>({...s,faculty:FACULTY.map(f=>({...f})),tierOverrides:{}}))}>Reset to default</button>
        <button className="btn" style={{marginLeft:"auto"}} onClick={next}>Continue →</button>
      </div>
    </div>
  );
}

function StepConfig({store,setStore,next}){
  const c=store.config;
  const set=(k,v)=>setStore(s=>({...s,config:{...s.config,[k]:v}}));
  return (
    <div className="card pad">
      <h2 style={{fontSize:20}}>Step 3 · Board configuration</h2>
      <p className="note" style={{marginTop:6,marginBottom:18}}>Structural dimensions of each panel.</p>
      <div className="grid2" style={{maxWidth:560}}>
        <div className="field">
          <label>Minimum groups per board (a board may take one extra)</label>
          <input type="number" min="1" max="8" value={c.targetGroupCount}
            onChange={e=>set("targetGroupCount",Math.max(1,+e.target.value||1))}/>
        </div>
        <div className="field">
          <label>Evaluators per board</label>
          <input type="number" min="2" max="4" value={c.evaluatorCount}
            onChange={e=>set("evaluatorCount",Math.max(2,+e.target.value||2))}/>
        </div>
      </div>
      <p className="note" style={{marginTop:14}}>
        The number above is the <b>minimum</b> groups per board; a board may absorb one extra (so 4 → up to 5)
        to avoid leaving a tiny board of 1–2 groups. Evaluators are picked randomly within the allowed tier each
        generation, so the same faculty aren't always chosen.
      </p>

      <div className="field" style={{marginTop:18,maxWidth:420}}>
        <label>Thesis / Project rule</label>
        <select value={c.separateByType?"separate":"mixed"}
          onChange={e=>set("separateByType",e.target.value==="separate")}>
          <option value="mixed">Combine — a board may mix Thesis and Project groups</option>
          <option value="separate">Separate — each board is only Thesis or only Project</option>
        </select>
      </div>

      {!c.separateByType ? (
        <div className="banner ui" style={{marginTop:12}}>
          <b>Thesis/Project mix per board.</b> For 4-group boards the engine prefers, in order:
          2T+2P → 3T+1P → 4T+0P → 1T+3P. For 5-group boards: 3T+2P → 2T+3P → 4T+1P → 5T+0P → 1T+4P.
          It satisfies the highest-priority pattern the pool allows; leftover groups that fit no pattern are
          still placed (best-effort) so no one is dropped.
        </div>
      ) : (
        <div className="banner ui" style={{marginTop:12}}>
          <b>Thesis/Project separated.</b> Each family's Thesis groups and Project groups are packed into their
          own boards independently, so no board ever contains both. If one type doesn't have enough leftover
          groups to fill a whole board on its own, it still gets a smaller board of just that type rather than
          being merged with the other — best-effort, so no one is dropped.
        </div>
      )}
      <div className="toolbar"><button className="btn" style={{marginLeft:"auto"}} onClick={next}>Continue →</button></div>
    </div>
  );
}

function StepSlots({store,setStore,next}){
  const slots=store.config.slots;
  const setSlots=(arr)=>setStore(s=>({...s,config:{...s.config,slots:arr}}));
  const update=(i,k,v)=>{const a=slots.map((s,idx)=>idx===i?{...s,[k]:v}:s);setSlots(a);};
  const add=()=>setSlots([...slots,{id:"S"+(slots.length+1),label:"",date:""}]);
  const remove=(i)=>setSlots(slots.filter((_,idx)=>idx!==i).map((s,idx)=>({...s,id:"S"+(idx+1)})));

  return (
    <div className="card pad">
      <h2 style={{fontSize:20}}>Step 4 · Time slots, dates &amp; rooms</h2>
      <p className="note" style={{marginTop:6,marginBottom:16}}>
        A faculty member can sit on multiple boards across <b>different</b> slots, but only one board per slot.
        Define each slot's time window and (optionally) a date. Room numbers are optional and can be backfilled
        on the generated boards.
      </p>
      <table>
        <thead><tr><th>Slot</th><th>Time window</th><th>Date (optional)</th><th></th></tr></thead>
        <tbody>
          {slots.map((s,i)=>(
            <tr key={i}>
              <td><b className="ui">{s.id}</b></td>
              <td><input className="ui" style={{padding:"8px 10px",border:"1px solid var(--line)",borderRadius:8,width:"100%"}}
                placeholder="e.g. 9:00am – 12:00pm" value={s.label} onChange={e=>update(i,"label",e.target.value)}/></td>
              <td><input type="date" className="ui" style={{padding:"8px 10px",border:"1px solid var(--line)",borderRadius:8}}
                value={s.date||""} onChange={e=>update(i,"date",e.target.value)}/></td>
              <td>{slots.length>1 && <button className="btn ghost" onClick={()=>remove(i)}>Remove</button>}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="toolbar">
        <button className="btn ghost" onClick={add}>+ Add slot</button>
        <button className="btn" style={{marginLeft:"auto"}} onClick={next}>Continue →</button>
      </div>
    </div>
  );
}

function StepGenerate({store,setStore}){
  const run=(reshuffle)=>{
    const seed = reshuffle ? (Date.now()>>>0) : (store.lastSeed ?? (Date.now()>>>0));
    const cfg={...store.config, facultyTierOverrides:store.tierOverrides, faculty:store.faculty, seed};
    const result=generateBoards(store.groups,cfg);
    result.boards.forEach(b=>{ const s=store.config.slots.find(x=>x.id===b.slot.id); if(s&&s.date)b.date=s.date; });
    // Draft only — NOT published yet. Admin edits then publishes explicitly.
    setStore(s=>({...s,result,lastSeed:seed,dirty:true}));
  };

  const [publishing,setPublishing]=useState(false);
  const [publishErr,setPublishErr]=useState("");
  const [justPublished,setJustPublished]=useState(false);

  const publish=async ()=>{
    if(!store.result || publishing) return;
    setPublishing(true);
    setPublishErr("");
    setJustPublished(false);
    const snap={
      boards:store.result.boards.map(b=>({...b,groups:b.groups.map(g=>({...g})),evaluators:b.evaluators.map(e=>({...e}))})),
      temporary:store.result.temporary.map(t=>({...t,group:{...t.group}})),
    };
    const slug=slugify(store.semester);

    const {error}=await sb.from("semesters").update(
      {published:snap, visible:true, updated_at:new Date().toISOString()}
    ).eq("slug",slug);

    setPublishing(false);
    if(error){ setPublishErr(error.message||"Publish failed."); return; }

    setStore(s=>({...s,dirty:false}));
    setJustPublished(true);
  };

  // Export the current draft to a multi-sheet .xlsx (admin view, with
  // supervisors) using the already-loaded SheetJS. One "Schedule" sheet (one
  // row per group) plus a "Temporary" sheet for unplaced groups.
  const exportExcel=()=>{
    const r=store.result; if(!r)return;
    const rows=[];
    for(const b of r.boards){
      for(const g of b.groups){
        rows.push({
          Board:b.boardId, Family:b.family, Cells:b.cells.join("/"),
          Slot:(b.slot?.label||b.slot?.id||""), Date:b.date||"", Room:b.room||"",
          Evaluators:b.evaluators.map(e=>`${e.name} (${e.tier})`).join("; "),
          Pairing:b.pairingRule, "Group ID":g.publicId, Type:g.type, Title:g.title,
          Students:(g.students||[]).join("; "),
          Supervisor:g.supervisor||"", "Co-Supervisor":g.coSupervisor||"",
        });
      }
    }
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Schedule");
    if(r.temporary.length){
      const tr=r.temporary.map(t=>({"Group ID":t.group.publicId||t.group.groupId,Title:t.group.title,Type:t.group.type,Cell:t.group.cell||"",Supervisor:t.group.supervisor||"",Reason:t.reason}));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tr),"Temporary");
    }
    XLSX.writeFile(wb,`Boards_${(store.semester||"semester").replace(/\s+/g,"_")}.xlsx`);
  };

  // Mutators for editing the draft result in place.
  const update=(mutator)=>setStore(s=>{
    const result={...s.result,
      boards:s.result.boards.map(b=>({...b,groups:b.groups.map(g=>({...g})),evaluators:b.evaluators.map(e=>({...e}))})),
      temporary:s.result.temporary.map(t=>({...t}))};
    mutator(result);
    return {...s,result,dirty:true};
  });

  const r=store.result;
  return (
    <div className="card pad">
      <h2 style={{fontSize:20}}>Step 5 · Generate, edit &amp; publish</h2>
      <p className="note" style={{marginTop:6,marginBottom:16}}>
        Generate runs the full rules engine. Group selection is reshuffled each time you press
        <b> Regenerate (reshuffle)</b>, so you get a different valid arrangement. Edit anything below,
        then <b>Publish</b> to push it to the student portal.
      </p>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <button className="btn" onClick={()=>run(true)} disabled={!store.groups.length}>
          {r? "Regenerate (reshuffle)":"Generate boards"}
        </button>
        {r && <button className="btn ghost" onClick={()=>run(false)} title="Re-run with the same seed">Re-run (same layout)</button>}
      </div>

      {r && (
        <div style={{marginTop:22}}>
          <div className="toolbar">
            <Stat n={r.boards.length} label="boards" />
            <Stat n={r.boards.reduce((a,b)=>a+b.groups.length,0)} label="groups placed" />
            <Stat n={r.temporary.length} label="on temporary board" />
            {store.dirty
              ? <span className="pill" style={{marginLeft:"auto",color:"var(--clay)",borderColor:"#e6c3ad"}}>Unpublished changes</span>
              : <span className="pill" style={{marginLeft:"auto",background:"var(--moss-100)",borderColor:"#bcd3c3",color:"var(--moss-700)"}}>Published to "{store.semester}"</span>}
            <button className="btn" onClick={publish} disabled={publishing}>{publishing?"Publishing…":"Publish to student portal"}</button>
            <button className="btn ghost" onClick={exportExcel} title="Download the full schedule as an Excel file">Export Excel</button>
            <button className="btn ghost" onClick={()=>window.print()} title="Print or save as PDF">Print</button>
          </div>
          {publishErr && (
            <div className="card pad" style={{marginTop:12,borderColor:"#e6c3ad",color:"var(--clay)"}}>
              Publish failed: {publishErr}
            </div>
          )}
          {justPublished && (
            <div className="card pad" style={{marginTop:12,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
              <b>Published "{store.semester}".</b>
              <code style={{background:"var(--moss-100)",padding:"4px 8px",borderRadius:6,fontSize:13}}>{location.origin}{location.pathname}</code>
              <button className="btn ghost" onClick={()=>{navigator.clipboard.writeText(location.origin+location.pathname);}}>Copy site link</button>
              <span className="note">Now visible to students. They open this link, pick "{store.semester}", and see the boards. Re-publishing updates the same entry. Uncheck "Visible to students" above to hide it again.</span>
            </div>
          )}

          {(()=>{
            const counts={}; r.boards.forEach(b=>counts[b.pairingRule]=(counts[b.pairingRule]||0)+1);
            const weak=(counts["any+any"]||0);
            return (
              <div className="ui" style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}>
                <span className="note">Seniority pairing:</span>
                {Object.entries(counts).map(([k,n])=>(
                  <span key={k} className="pill" style={k==="any+any"?{color:"var(--clay)",borderColor:"#e6c3ad"}:{}}>{k}: {n}</span>
                ))}
                {weak>0 && <span className="note" style={{color:"var(--clay)"}}>· {weak} board(s) without a senior+junior split.</span>}
              </div>
            );
          })()}

          {(()=>{
            const counts={}; r.boards.forEach(b=>counts[b.composition]=(counts[b.composition]||0)+1);
            const offRule=r.separateByType?r.boards.filter(b=>!b.compositionOk).length:0;
            return (
              <div className="ui" style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:6,alignItems:"center"}}>
                <span className="note">{r.separateByType?"Thesis/Project split (kept separate):":"Thesis/Project mix:"}</span>
                {Object.entries(counts).map(([k,n])=>{
                  const ok=r.boards.find(b=>b.composition===k)?.compositionOk;
                  return <span key={k} className="pill" style={ok?{}:{color:"var(--clay)",borderColor:"#e6c3ad"}}>{k}: {n}</span>;
                })}
                {offRule>0 && <span className="note" style={{color:"var(--clay)"}}>· {offRule} board(s) mix both types (from a manual move).</span>}
              </div>
            );
          })()}

          <div className="banner ui" style={{marginTop:12}}>
            <b>Editing:</b> change a board's date/time/room and evaluators inline; use the <b>Move</b> control on any
            group to send it to another board (composition pills update live). Supervisor / co-supervisor are shown
            here for your review but are <b>hidden on the student portal</b>.
          </div>

          <EditableBoards result={r} faculty={store.faculty} tierOverrides={store.tierOverrides} update={update} evaluatorCount={store.config.evaluatorCount} />
        </div>
      )}
    </div>
  );
}

// Recompute composition label after edits/moves.
function recomposition(board,separateByType){
  const t=board.groups.filter(g=>g.type==="Thesis").length;
  const p=board.groups.filter(g=>g.type!=="Thesis").length;
  board.composition=`${t}T+${p}P`;
  board.compositionOk=separateByType?(t===0||p===0):isPreferredComposition(t,p);
  board.cells=[...new Set(board.groups.map(g=>g.cell))];
}

function EditableBoards({result,faculty,tierOverrides,update,evaluatorCount}){
  const boards=result.boards;
  const tierOf=(f)=> Object.prototype.hasOwnProperty.call(tierOverrides,f.id)?tierOverrides[f.id]:f.tier;
  const [newFamily,setNewFamily]=useState(FAMILIES[0].id);

  const setBoardField=(bi,field,val)=>update(r=>{ r.boards[bi][field]=val; });

  // Manually add a brand-new, empty board (e.g. for an ad-hoc panel that
  // wasn't produced by the generator). Its ID continues the existing B01,
  // B02… sequence. Groups can then be moved into it (via each group's
  // "Move to…" control or a Temporary group's "Assign to…" control) and
  // evaluators picked from the chosen family's eligible faculty.
  const addBoard=(familyId)=>update(r=>{
    const nums=r.boards.map(b=>{ const m=/^B0*(\d+)$/.exec(String(b.boardId||"")); return m?+m[1]:0; });
    const nextNum=(nums.length?Math.max(...nums):0)+1;
    r.boards.push({
      boardId:`B${String(nextNum).padStart(2,"0")}`,
      family:familyId,
      cells:[], slot:{id:"custom",label:""}, date:null, room:null,
      composition:"0T+0P", compositionOk:true,
      sizeNote:"New board — add groups and evaluators.",
      evaluators:Array.from({length:Math.max(2,evaluatorCount||2)},()=>({id:"",name:"",designation:"",cell:"",code:"",tier:null})),
      pairingRule:"manual",
      groups:[],
    });
  });

  const moveGroup=(fromBi,gi,toBi)=>update(r=>{
    if(toBi==="TEMP"){
      const [g]=r.boards[fromBi].groups.splice(gi,1);
      r.temporary.push({group:{groupId:g.groupId,title:g.title,type:g.type,students:g.students,supervisor:g.supervisor,coSupervisor:g.coSupervisor,cell:g.cell,publicId:g.publicId},reason:"Moved manually by admin."});
      recomposition(r.boards[fromBi],r.separateByType);
    } else {
      const ti=+toBi;
      const [g]=r.boards[fromBi].groups.splice(gi,1);
      r.boards[ti].groups.push(g);
      recomposition(r.boards[fromBi],r.separateByType); recomposition(r.boards[ti],r.separateByType);
    }
  });

  const restoreTemp=(ti,toBi)=>update(r=>{
    const [t]=r.temporary.splice(ti,1);
    const g={...t.group};
    r.boards[+toBi].groups.push(g); recomposition(r.boards[+toBi],r.separateByType);
  });

  // Permanently remove a group from a board (deleted from the schedule, not
  // routed to Temporary).
  const removeGroup=(bi,gi)=>update(r=>{ r.boards[bi].groups.splice(gi,1); recomposition(r.boards[bi],r.separateByType); });
  // Remove a group sitting on the Temporary board.
  const removeTemp=(ti)=>update(r=>{ r.temporary.splice(ti,1); });

  const setEvaluator=(bi,ei,fid)=>update(r=>{
    if(!fid){ r.boards[bi].evaluators[ei]={id:"",name:"",designation:"",cell:"",code:"",tier:null}; return; }
    const f=faculty.find(x=>x.id===fid); if(!f)return;
    r.boards[bi].evaluators[ei]={id:f.id,name:f.name,designation:f.designation,cell:f.cell,code:f.code,tier:(Object.prototype.hasOwnProperty.call(tierOverrides,f.id)?tierOverrides[f.id]:f.tier)};
  });
  // Manually add an extra evaluator slot to a board — the dropdown offers
  // the normal family-eligible faculty first, but also lists everyone else
  // so admin can hand-pick someone outside the automatic pairing rules.
  const addEvaluator=(bi)=>update(r=>{ r.boards[bi].evaluators.push({id:"",name:"",designation:"",cell:"",code:"",tier:null}); });
  const removeEvaluator=(bi,ei)=>update(r=>{ r.boards[bi].evaluators.splice(ei,1); });

  const setGroupField=(bi,gi,field,val)=>update(r=>{ r.boards[bi].groups[gi][field]=val; if(field==="type")recomposition(r.boards[bi],r.separateByType); });

  // Board number (boardId, e.g. "B01") — distinct from the free-text display name.
  const setBoardId=(bi,val)=>update(r=>{
    const v=String(val||"").trim(); if(!v)return;
    r.boards[bi].boardId=v;
  });

  // Per-student name/ID editing within a group.
  const setStudentField=(bi,gi,si,field,val)=>update(r=>{
    const list=r.boards[bi].groups[gi].students||(r.boards[bi].groups[gi].students=[]);
    const {name,id}=parseStudent(list[si]);
    const next=field==="name"?{name:val,id}:{name,id:val};
    list[si]=formatStudent(next.name,next.id);
  });
  const addStudentToGroup=(bi,gi)=>update(r=>{
    const g=r.boards[bi].groups[gi]; (g.students||(g.students=[])).push("");
  });
  const removeStudentFromGroup=(bi,gi,si)=>update(r=>{
    r.boards[bi].groups[gi].students.splice(si,1);
  });

  const deleteBoard=(bi)=>update(r=>{
    const board=r.boards[bi];
    for(const g of board.groups){
      r.temporary.push({group:{groupId:g.groupId,publicId:g.publicId,title:g.title,type:g.type,students:g.students,supervisor:g.supervisor,coSupervisor:g.coSupervisor,cell:g.cell},reason:`Board ${board.boardId} was deleted by admin.`});
    }
    r.boards.splice(bi,1);
  });

  return (
    <div>
      <div className="toolbar ui" style={{marginTop:0}}>
        <span className="note">Need an extra panel?</span>
        <select className="mini" value={newFamily} onChange={e=>setNewFamily(e.target.value)}>
          {FAMILIES.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
        </select>
        <button className="btn ghost" onClick={()=>addBoard(newFamily)}>+ Add new board</button>
      </div>
      {boards.map((b,bi)=>(
        <div className="card board" key={b.boardId}>
          <div className="bhead">
            <input className="ui" value={b.boardId} title="Board number / ID (e.g. B01) — used internally, keep it unique"
              onChange={e=>setBoardId(bi,e.target.value)}
              style={{font:"800 12px/1 ui-sans-serif",letterSpacing:".04em",color:"var(--moss-700)",background:"#fff",
                padding:"8px 9px",borderRadius:9,border:"1px solid var(--moss)",width:64,textAlign:"center"}}/>
            <input className="ui" value={b.name ?? boardLabel(b.boardId)} title="Click to rename this board"
              onChange={e=>setBoardField(bi,"name",e.target.value)}
              style={{font:"800 13px/1 ui-sans-serif",letterSpacing:".06em",color:"#fff",background:"var(--moss)",
                padding:"8px 11px",borderRadius:9,border:"1px solid var(--moss-700)",width:Math.max(96,(b.name??boardLabel(b.boardId)).length*8+30)}}/>
            <div style={{flex:1}}>
              <div className="bmeta" style={{alignItems:"center"}}>
                <span><b>{cellComp(b)}</b></span>
                <span className="pill" style={{padding:"3px 8px"}}>pairing {b.pairingRule}</span>
                {b.sizeNote && <span className="pill" style={{padding:"3px 8px",background:"#fdf6f1",borderColor:"#e6c3ad",color:"var(--clay)"}}>⚠ {b.sizeNote}</span>}
                <button className="delboard" title="Delete this board (its groups move to Temporary)"
                  onClick={()=>{ if(confirm(`Delete ${boardName(b)}? Its ${b.groups.length} group(s) will move to the Temporary board for reassignment.`)) deleteBoard(bi); }}>
                  Delete board
                </button>
              </div>
              <div className="bmeta" style={{alignItems:"center",marginTop:8}}>
                <span>🕑 <input className="mini" value={b.slot?.label||""} placeholder="time"
                  onChange={e=>setBoardField(bi,"slot",{...b.slot,label:e.target.value})}/></span>
                <span>📅 <input type="date" className="mini" value={b.date||""} onChange={e=>setBoardField(bi,"date",e.target.value)}/></span>
                <span>📍 <input className="mini" value={b.room||""} placeholder="room" onChange={e=>setBoardField(bi,"room",e.target.value)}/></span>
              </div>
            </div>
            <div className="when">
              <span className="wdate">{fmtDate(b.date)}</span>
              <span className="wtime">{b.slot?.label||b.slot?.id||"Time TBA"}</span>
              {b.room && <span className="wroom">📍 {b.room}</span>}
            </div>
          </div>

          <div className="evs">
            <span className="note" style={{alignSelf:"center",marginRight:4}}>Evaluators:</span>
            {(()=>{
              // Faculty already sitting on a DIFFERENT board at this board's exact
              // date + time slot can't also sit here — cross-board double-booking
              // check. Only applies once both a date and a time are set.
              const timeKey=b.slot?.label||b.slot?.id||"";
              const crossBusy=new Set();
              if(b.date && timeKey){
                boards.forEach((ob,oi)=>{
                  if(oi===bi) return;
                  const obTime=ob.slot?.label||ob.slot?.id||"";
                  if(ob.date===b.date && obTime===timeKey){
                    ob.evaluators.forEach(ev=>{ if(ev.id) crossBusy.add(ev.id); });
                  }
                });
              }
              return b.evaluators.map((e,ei)=>{
                const fam=FAMILIES.find(f=>f.id===b.family);
                // Also exclude anyone already picked in another evaluator slot on this same board.
                const sameBoardBusy=new Set(b.evaluators.filter((_,idx)=>idx!==ei).map(x=>x.id).filter(Boolean));
                const isFree=f=>f.id===e.id || (!crossBusy.has(f.id) && !sameBoardBusy.has(f.id));
                const eligible=faculty.filter(f=>fam&&fam.cells.includes(f.cell)&&tierOf(f)&&isFree(f));
                const eligibleIds=new Set(eligible.map(f=>f.id));
                const others=faculty.filter(f=>!eligibleIds.has(f.id)&&isFree(f));
                const label=o=>`${o.name.replace(/^(Mr\.|Mrs\.|Ms\.|Prof\. Dr\.|Dr\.) /,"")} (${CELL_SHORT[o.cell]||o.cell})`;
                return (
                  <span className="ev" key={ei}>
                    <TierBadge t={e.tier}/>
                    <select className="evsel" value={e.id} onChange={ev=>setEvaluator(bi,ei,ev.target.value)}>
                      <option value="">— choose faculty —</option>
                      <optgroup label="Eligible for this family">
                        {eligible.map(o=><option key={o.id} value={o.id}>{label(o)}</option>)}
                      </optgroup>
                      {others.length>0 && (
                        <optgroup label="Other faculty (manual add)">
                          {others.map(o=><option key={o.id} value={o.id}>{label(o)}</option>)}
                        </optgroup>
                      )}
                    </select>
                    <button className="xbtn" title="Remove this evaluator" onClick={()=>removeEvaluator(bi,ei)}>×</button>
                  </span>
                );
              });
            })()}
            <button className="btn ghost" style={{padding:"6px 12px",fontSize:12}} onClick={()=>addEvaluator(bi)}>+ Add evaluator</button>
          </div>

          <div className="pad" style={{paddingTop:8}}>
            <table>
              <thead><tr><th>ID</th><th>Type</th><th>Cell</th><th>Title</th><th>Students</th><th>Supervisor (admin only)</th><th>Move</th><th></th></tr></thead>
              <tbody>
                {b.groups.map((g,gi)=>(
                  <tr key={g.groupId+gi}>
                    <td><b className="ui">{g.publicId||g.groupId}</b></td>
                    <td>
                      <select className="mini" value={g.type} onChange={e=>setGroupField(bi,gi,"type",e.target.value)}>
                        <option>Thesis</option><option>Project</option>
                      </select>
                    </td>
                    <td><span className="pill" style={{padding:"3px 8px"}} title={CELLS[g.cell]||""}>{CELL_SHORT[g.cell]||g.cell||"—"}</span></td>
                    <td><input className="mini wide" value={g.title} onChange={e=>setGroupField(bi,gi,"title",e.target.value)}/></td>
                    <td style={{minWidth:220}}>
                      {(g.students||[]).map((s,si)=>{
                        const {name,id}=parseStudent(s);
                        return (
                          <div key={si} style={{display:"flex",gap:4,marginBottom:4,alignItems:"center"}}>
                            <input className="mini" placeholder="Name" value={name}
                              onChange={e=>setStudentField(bi,gi,si,"name",e.target.value)}
                              style={{width:110}}/>
                            <input className="mini" placeholder="ID" value={id}
                              onChange={e=>setStudentField(bi,gi,si,"id",e.target.value)}
                              style={{width:90}}/>
                            <button className="xbtn" title="Remove this student" onClick={()=>removeStudentFromGroup(bi,gi,si)}>×</button>
                          </div>
                        );
                      })}
                      <button className="linkbtn" onClick={()=>addStudentToGroup(bi,gi)}>+ Add student</button>
                    </td>
                    <td style={{fontSize:12.5}}>{g.supervisor}{g.coSupervisor?` · ${g.coSupervisor}`:""}</td>
                    <td>
                      <select className="mini" value="" onChange={e=>{ if(e.target.value!=="")moveGroup(bi,gi,e.target.value); }}>
                        <option value="">Move to…</option>
                        {boards.map((ob,oi)=> oi!==bi && <option key={ob.boardId} value={oi}>{`${boardName(ob)} — ${ob.groups.length} grp · ${ob.cells.map(c=>CELL_SHORT[c]).join("+")}`}</option>)}
                        <option value="TEMP">Temporary board</option>
                      </select>
                    </td>
                    <td>
                      <button className="delgrp" title="Remove this group from the schedule"
                        onClick={()=>{ if(confirm(`Remove "${g.title||g.publicId||g.groupId}" from ${boardName(b)}? It will be deleted from the schedule (not sent to Temporary).`)) removeGroup(bi,gi); }}>Remove</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ))}

      {result.temporary.length>0 && (
        <div className="card board temp">
          <div className="bhead">
            <span className="id id2" style={{background:"var(--clay)"}}>TEMP</span>
            <div><div className="fam" style={{color:"var(--clay)"}}>Temporary board · manual review</div>
              <div className="bmeta"><span>{result.temporary.length} group(s)</span></div></div>
          </div>
          <div className="pad">
            <table>
              <thead><tr><th>ID</th><th>Type</th><th>Cell</th><th>Title</th><th>Supervisor</th><th>Reason</th><th>Assign</th><th></th></tr></thead>
              <tbody>
                {result.temporary.map((t,ti)=>(
                  <tr key={ti}>
                    <td><b className="ui">{t.group.publicId||t.group.groupId}</b></td>
                    <td><TypePill t={t.group.type}/></td>
                    <td><span className="pill" style={{padding:"3px 8px"}} title={CELLS[t.group.cell]||""}>{CELL_SHORT[t.group.cell]||t.group.cell||"—"}</span></td>
                    <td>{t.group.title}</td>
                    <td className="muted" style={{fontSize:12}}>{t.group.supervisor||"—"}</td>
                    <td className="muted" style={{fontSize:11}}>{t.reason}</td>
                    <td>
                      <select className="mini" value="" onChange={e=>{ if(e.target.value!=="")restoreTemp(ti,e.target.value); }}>
                        <option value="">Assign to…</option>
                        {boards.map((ob,oi)=><option key={ob.boardId} value={oi}>{`${boardName(ob)} — ${ob.groups.length} grp · ${ob.cells.map(c=>CELL_SHORT[c]).join("+")}`}</option>)}
                      </select>
                    </td>
                    <td>
                      <button className="delgrp" title="Remove this group entirely"
                        onClick={()=>{ if(confirm(`Remove "${t.group.title||t.group.publicId||t.group.groupId}" from the schedule entirely?`)) removeTemp(ti); }}>Remove</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

/* =======================================================================
   PUBLIC PORTAL — redesigned board card
   ======================================================================= */
function Members({students}){
  const list=students||[];
  const [open,setOpen]=useState(false);
  if(list.length===0) return <span className="muted">—</span>;
  return (
    <div className="members">
      {/* mobile: "👥 N students" first, tap to expand names (CSS-gated) */}
      <button className="stucount" onClick={()=>setOpen(o=>!o)}>
        <span>👥 {list.length} student{list.length>1?"s":""}</span>
        <span>{open?"▴":"▾"}</span>
      </button>
      <div className={"stunames"+(open?" open":"")}>{list.join(", ")}</div>
    </div>
  );
}

function PortalBoardCard({b}){
  const initials=(name)=>String(name||"").replace(/^(Mr\.|Mrs\.|Ms\.|Md\.|Prof\.|Dr\.|Prof\. Dr\.)\s*/g,"")
    .split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  const avatar=(e)=> (e.code && e.code.trim()) ? e.code.trim() : initials(e.name);
  const [evOpen,setEvOpen]=useState(false);
  const [copied,setCopied]=useState(false);
  const tCount=b.groups.filter(g=>g.type==="Thesis").length;
  const pCount=b.groups.length-tCount;
  const stuCount=b.groups.reduce((n,g)=>n+((g.students||[]).length),0);
  const copyRoom=()=>{
    if(!b.room) return;
    const done=()=>{setCopied(true);setTimeout(()=>setCopied(false),1500);};
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(b.room).then(done).catch(()=>{});
  };
  return (
    <div className="card pcard board">
      <div className="phead">
        <div>
          <div className="ptitle">{boardName(b)}</div>
        </div>
        <div className="pwhen">
          <span className="pwdate">{fmtDate(b.date)}</span>
          <span className="pwtime">🕑 {b.slot?.label||b.slot?.id||"Time TBA"}</span>
          <span className="pwroom">📍 {b.room||"Room TBA"}</span>

/* =======================================================================
   PUBLIC  PORTAL  (Student portal tab — no login, reads from Supabase.
   Shows a semester selection bar first, then that semester's boards.
   This is the tab students use via the one shared site link.)
   ======================================================================= */
function PublicPortal(){
  const [status,setStatus]=useState("loading"); // loading | ok | empty | error
  const [list,setList]=useState([]);            // [{slug,semester}]
  const [sem,setSem]=useState(null);             // currently selected {slug,semester}
  const [boardData,setBoardData]=useState(null); // {boards,temporary} for selected sem
  const [boardStatus,setBoardStatus]=useState("idle"); // idle | loading | ok | error
  const [q,setQ]=useState("");

  // Load the list of visible semesters (light query — no board data yet).
  // RLS only returns rows where visible=true, so hidden/draft-only semesters
  // never reach students. We also require a non-null published snapshot.
  useEffect(()=>{
    let cancelled=false;
    sb.from("semesters").select("slug,name").eq("visible",true).not("published","is",null).order("updated_at",{ascending:false})
      .then(({data,error})=>{
        if(cancelled) return;
        if(error){ setStatus("error"); return; }
        const rows=(data||[]).map(r=>({slug:r.slug,semester:r.name}));
        setList(rows);
        setStatus(rows.length?"ok":"empty");
      })
      .catch(()=>{ if(!cancelled) setStatus("error"); });
    return ()=>{ cancelled=true; };
  },[]);

  // Load the full board data only once a semester is picked.
  useEffect(()=>{
    if(!sem) return;
    let cancelled=false;
    setBoardStatus("loading");
    sb.from("semesters").select("published").eq("slug",sem.slug).single()
      .then(({data,error})=>{
        if(cancelled) return;
        if(error||!data||!data.published){ setBoardStatus("error"); return; }
        setBoardData(data.published); setBoardStatus("ok");
      })
      .catch(()=>{ if(!cancelled) setBoardStatus("error"); });
    return ()=>{ cancelled=true; };
  },[sem]);

  const filtered=useMemo(()=>{
    if(!boardData) return null;
    const needle=q.trim().toLowerCase();
    const match=(b)=>{
      if(!needle) return true;
      const hay=[boardLabel(b.boardId),boardName(b),b.room,...b.evaluators.map(e=>e.name),
        ...b.groups.flatMap(g=>[g.title,...(g.students||[])])]
        .join(" ").toLowerCase();
      return hay.includes(needle);
    };
    return {boards:boardData.boards.filter(match)};
  },[boardData,q]);

  const Footer=()=>(
    <div className="footer">
      <div><b>Md. Shoab Alam (Lecturer)</b> · CSE Department, Green University of Bangladesh</div>
      <div>📞 <a href="tel:01869116828">01869116828</a> · ✉ <a href="mailto:shoab@cse.green.edu.bd">shoab@cse.green.edu.bd</a></div>
    </div>
  );

  return (
    <div className="wrap" style={{padding:"30px 22px 80px"}}>
      <div className="eyebrow">Student &amp; faculty portal</div>
      <h1 style={{fontSize:30,margin:"6px 0 14px"}}>Defense schedule</h1>

      {status==="loading" && <div className="card empty">Loading semesters…</div>}
      {status==="error" && <div className="card empty">Couldn't load schedules right now. Please refresh or try again shortly.</div>}
      {status==="empty" && <div className="card empty">No schedules published yet. Please check back later.</div>}

      {status==="ok" && !sem && (
        // --- semester selection bar ---
        <div className="card pad">
          <h2 style={{fontSize:18,marginBottom:6}}>Select a semester</h2>
          <p className="note" style={{marginBottom:16}}>Choose which semester's defense schedule you'd like to view.</p>
          <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
            {list.map(s=>(
              <button key={s.slug} className="btn" style={{fontSize:15,padding:"12px 20px"}} onClick={()=>{setSem(s);setQ("");}}>{s.semester}</button>
            ))}
          </div>
        </div>
      )}

      {sem && (
        <>
          <div className="search">
            <button className="btn ghost" onClick={()=>{setSem(null);setBoardData(null);setQ("");}} title="Choose a different semester">← Semesters</button>
            <span className="pill" style={{alignSelf:"center",padding:"6px 12px",fontSize:14}}>{sem.semester}</span>
            {boardStatus==="ok" && <input placeholder="Search by Student ID, name, title, or room…" value={q} onChange={e=>setQ(e.target.value)} />}
          </div>
          {boardStatus==="loading" && <div className="card empty">Loading schedule…</div>}
          {boardStatus==="error" && <div className="card empty">Couldn't load this schedule. Please try again.</div>}
          {boardStatus==="ok" && (
            filtered.boards.length
              ? <BoardList boards={filtered.boards} temporary={[]} />
              : <div className="card empty">
                  <div style={{fontSize:40,marginBottom:10}}>🔍</div>
                  <div style={{font:"700 16px/1.4 ui-sans-serif",color:"var(--ink)",marginBottom:6}}>No results found</div>
                  <div style={{marginBottom:16}}>Nothing matches "{q}". Try a Student ID, a name, a title keyword, or a room number.</div>
                  <button className="btn ghost" onClick={()=>setQ("")}>Clear search</button>
                </div>
          )}
        </>
      )}
      <Footer/>
    </div>
  );
}

/* =======================================================================
   ADMIN  WORKSPACE  —  semester picker + per-semester state in Supabase
   After login the admin sees a list of existing semesters (or creates a
   new one). Selecting one loads its full working state from the `semesters`
   table; every change auto-saves back (debounced). Nothing lives only in
   localStorage anymore, so the admin can continue from any machine.
   ======================================================================= */
function makeDefaultState(name){
  return {
    semester:name,
    groups:[],
    rawSheets:null,
    onlyConfirmed:false,
    faculty:FACULTY.map(f=>({...f})),
    tierOverrides:{},
    config:{ targetGroupCount:4, evaluatorCount:2, separateByType:false,
      slots:[{id:"S1",label:"9:00am – 12:00pm",date:""},{id:"S2",label:"2:00pm – 5:00pm",date:""}] },
    result:null,
    dirty:false,
    adminStep:1,
  };
}

function SemesterPicker({onOpen}){
  const [status,setStatus]=useState("loading"); // loading | ok | error
  const [rows,setRows]=useState([]);            // [{slug,name,visible,published}]
  const [newName,setNewName]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");

  const load=()=>{
    setStatus("loading");
    sb.from("semesters").select("slug,name,visible,published").order("updated_at",{ascending:false})
      .then(({data,error})=>{
        if(error){ setStatus("error"); return; }
        setRows(data||[]); setStatus("ok");
      })
      .catch(()=>setStatus("error"));
  };
  useEffect(load,[]);

  const create=async ()=>{
    const name=newName.trim(); if(!name||busy) return;
    setBusy(true); setErr("");
    const slug=slugify(name);
    const {error}=await sb.from("semesters").insert(
      {slug, name, state:makeDefaultState(name), visible:false}
    );
    setBusy(false);
    if(error){
      setErr(error.code==="23505" ? "A semester with that name already exists." : (error.message||"Could not create semester."));
      return;
    }
    setNewName("");
    onOpen(slug);
  };

  const remove=async (slug,name)=>{
    if(!window.confirm(`Delete "${name}" and all its data? This cannot be undone.`)) return;
    const {error}=await sb.from("semesters").delete().eq("slug",slug);
    if(error){ alert("Delete failed: "+error.message); return; }
    load();
  };

  return (
    <div className="wrap" style={{padding:"26px 22px 80px",maxWidth:720}}>
      <div className="eyebrow">Admin workspace</div>
      <h1 style={{fontSize:30,margin:"6px 0 16px"}}>Semesters</h1>

      <div className="card pad" style={{marginBottom:18}}>
        <h2 style={{fontSize:16,marginBottom:10}}>Create a new semester</h2>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <input style={{flex:"1 1 240px"}} value={newName} placeholder="e.g. Spring 2026"
            onChange={e=>setNewName(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter") create(); }} />
          <button className="btn" onClick={create} disabled={!newName.trim()||busy}>{busy?"Creating…":"Create & open"}</button>
        </div>
        {err && <p className="note" style={{color:"var(--clay)",marginTop:10}}>{err}</p>}
      </div>

      <h2 style={{fontSize:16,margin:"0 0 10px"}}>Existing semesters</h2>
      {status==="loading" && <div className="card empty">Loading…</div>}
      {status==="error" && <div className="card empty">Couldn't load semesters. Refresh to try again.</div>}
      {status==="ok" && !rows.length && <div className="card empty">No semesters yet. Create one above.</div>}
      {status==="ok" && rows.map(r=>(
        <div key={r.slug} className="card pad" style={{marginBottom:10,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <div>
            <div style={{font:"700 16px/1.3 ui-sans-serif"}}>{r.name}</div>
            <div className="note">
              {r.published ? "Published" : "Draft only"} · {r.visible ? "visible to students" : "hidden"}
            </div>
          </div>
          <div style={{marginLeft:"auto",display:"flex",gap:8}}>
            <button className="btn" onClick={()=>onOpen(r.slug)}>Open</button>
            <button className="btn ghost" style={{color:"var(--clay)",borderColor:"#e6c3ad"}} onClick={()=>remove(r.slug,r.name)}>Delete</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function AdminWorkspace(){
  const [slug,setSlug]=useState(null);          // open semester slug, or null = picker
  const [store,setStore]=useState(null);        // loaded working state
  const [visible,setVisible]=useState(false);
  const [loadStatus,setLoadStatus]=useState("idle"); // idle|loading|ok|error
  const [saveState,setSaveState]=useState("");  // "Saved" | "Saving…" | "Save failed"
  const saveTimer=useRef(null);
  const skipNextSave=useRef(false);             // don't save immediately after loading

  // Load a semester's full state when one is opened.
  useEffect(()=>{
    if(!slug){ setStore(null); return; }
    setLoadStatus("loading");
    sb.from("semesters").select("name,state,visible").eq("slug",slug).single()
      .then(({data,error})=>{
        if(error||!data){ setLoadStatus("error"); return; }
        skipNextSave.current=true;
        const st=data.state && data.state.semester ? data.state : makeDefaultState(data.name);
        st.semester=data.name; // keep name authoritative
        setStore(st);
        setVisible(!!data.visible);
        setLoadStatus("ok");
      })
      .catch(()=>setLoadStatus("error"));
  },[slug]);

  // Debounced auto-save of the working state on every change.
  useEffect(()=>{
    if(!slug || !store) return;
    if(skipNextSave.current){ skipNextSave.current=false; return; }
    setSaveState("Saving…");
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async ()=>{
      const {error}=await sb.from("semesters")
        .update({state:store, updated_at:new Date().toISOString()})
        .eq("slug",slug);
      setSaveState(error ? "Save failed" : "Saved");
    },800);
    return ()=>clearTimeout(saveTimer.current);
  },[store,slug]);

  const toggleVisible=async (v)=>{
    setVisible(v);
    const {error}=await sb.from("semesters").update({visible:v,updated_at:new Date().toISOString()}).eq("slug",slug);
    if(error){ setVisible(!v); alert("Couldn't update visibility: "+error.message); }
  };

  // Rename the display name only. The slug (primary key + student link) stays
  // fixed, so existing links and all saved data remain valid. Also mirrors the
  // new name into the published snapshot's implicit label via the name column.
  const renameSemester=async (newName)=>{
    const {error}=await sb.from("semesters")
      .update({name:newName, updated_at:new Date().toISOString()})
      .eq("slug",slug);
    if(error){ alert("Rename failed: "+error.message); return false; }
    return true;
  };

  if(!slug){
    return <SemesterPicker onOpen={setSlug} />;
  }
  if(loadStatus==="loading"||!store){
    return <div className="wrap" style={{padding:"60px 22px"}}><div className="card empty">Loading semester…</div></div>;
  }
  if(loadStatus==="error"){
    return (
      <div className="wrap" style={{padding:"60px 22px"}}>
        <div className="card empty">Couldn't load this semester.
          <div style={{marginTop:12}}><button className="btn ghost" onClick={()=>setSlug(null)}>← Back to semesters</button></div>
        </div>
      </div>
    );
  }
  return (
    <Admin
      store={store} setStore={setStore}
      onExit={()=>{ clearTimeout(saveTimer.current); setSlug(null); }}
      saveState={saveState}
      visible={visible} onToggleVisible={toggleVisible}
      onRename={renameSemester}
    />
  );
}

/* =======================================================================
   ADMIN  LOGIN  GATE
   Real authentication via Supabase Auth — the username/password are never
   stored in this file. They live only in Supabase's own auth system.
   The admin account itself must be created once in the Supabase dashboard
   (see setup notes). "username" here maps to a hidden fixed email domain
   so a normal short username can be used instead of a full email address.
   ======================================================================= */
const ADMIN_EMAIL_DOMAIN = "gub.local"; // not secret — just a namespacing suffix

function AdminGate({children}){
  const [session,setSession]=useState(undefined); // undefined=checking, null=signed out
  const [username,setUsername]=useState("");
  const [password,setPassword]=useState("");
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub}=sb.auth.onAuthStateChange((_event,sess)=>setSession(sess));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  const signIn=async (e)=>{
    e.preventDefault();
    if(!username.trim()||!password) return;
    setBusy(true); setErr("");
    const email=username.trim().toLowerCase()+"@"+ADMIN_EMAIL_DOMAIN;
    const {error}=await sb.auth.signInWithPassword({email,password});
    setBusy(false);
    if(error) setErr("Incorrect username or password.");
  };

  if(session===undefined){
    return <div className="wrap" style={{padding:"60px 22px"}}><div className="card empty">Checking session…</div></div>;
  }

  if(!session){
    return (
      <div className="wrap" style={{padding:"60px 22px",maxWidth:420}}>
        <div className="eyebrow">Admin workspace</div>
        <h1 style={{fontSize:26,margin:"6px 0 20px"}}>Sign in</h1>
        <form className="card pad" onSubmit={signIn}>
          <div className="field">
            <label>Username</label>
            <input autoFocus value={username} onChange={e=>setUsername(e.target.value)} autoComplete="username" />
          </div>
          <div className="field" style={{marginTop:12}}>
            <label>Password</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} autoComplete="current-password" />
          </div>
          {err && <p className="note" style={{color:"var(--clay)",marginTop:10}}>{err}</p>}
          <div className="toolbar" style={{marginTop:16}}>
            <button className="btn" style={{marginLeft:"auto"}} disabled={busy} type="submit">{busy?"Signing in…":"Sign in"}</button>
          </div>
        </form>
      </div>
    );
  }

  return (
    <div>
      <div className="wrap" style={{padding:"14px 22px 0",display:"flex",justifyContent:"flex-end"}}>
        <button className="btn ghost ui" style={{fontSize:12,padding:"6px 10px"}} onClick={()=>sb.auth.signOut()}>Sign out</button>
      </div>
      {children}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
