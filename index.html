<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GUB CSE — Thesis/Project Board Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#15201a; --paper:#f6f4ec; --card:#fffdf7; --line:#d9d2c2;
    --moss:#2f5d45; --moss-700:#234a36; --moss-100:#e3ede6;
    --clay:#b4552d; --clay-100:#f3e2d8;
    --gold:#b8893a; --muted:#6c6557;
    --shadow:0 1px 2px rgba(20,32,26,.06),0 8px 24px rgba(20,32,26,.06);
    --r:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    -webkit-font-smoothing:antialiased;}
  .ui{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;}
  a{color:var(--moss-700)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}

  /* top bar */
  .top{position:sticky;top:0;z-index:30;background:rgba(246,244,236,.86);
    backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--line)}
  .top .row{display:flex;align-items:center;gap:18px;height:66px}
  .mark{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.2px}
  .mark .logo{width:38px;height:38px;border-radius:10px;flex:0 0 38px;
    background:linear-gradient(145deg,#3c714f,#1f4630);
    display:grid;place-items:center;box-shadow:0 2px 6px rgba(31,70,48,.28),inset 0 1px 0 rgba(255,255,255,.18)}
  .mark .logo svg{display:block}
  .mark small{display:block;font:500 11px/1 ui-sans-serif;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
  .seg{margin-left:auto;display:flex;background:var(--moss-100);border:1px solid var(--line);
    border-radius:999px;padding:4px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--moss-700);
    padding:7px 16px;border-radius:999px;font:600 13px/1 ui-sans-serif}
  .seg button.on{background:var(--moss);color:#fff;box-shadow:var(--shadow)}
  .reset-mini{display:none} /* desktop: full "Reset data" label; mobile media query flips this */
  .saveflag{font:600 12px/1 ui-sans-serif;color:var(--muted)}

  /* generic */
  h1,h2,h3{font-weight:600;letter-spacing:-.01em;margin:0}
  .eyebrow{font:600 11px/1 ui-sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--clay)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:22px}
  .muted{color:var(--muted)}
  .btn{border:1px solid var(--moss);background:var(--moss);color:#fff;border-radius:10px;
    padding:10px 18px;font:600 14px/1 ui-sans-serif}
  .btn:hover{background:var(--moss-700)}
  .btn.ghost{background:transparent;color:var(--moss-700)}
  .btn.ghost:hover{background:var(--moss-100)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .pill{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 ui-sans-serif;
    padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#fff}
  .pill.thesis{background:var(--moss-100);border-color:#bcd3c3;color:var(--moss-700)}
  .pill.project{background:var(--clay-100);border-color:#e6c3ad;color:var(--clay)}
  .tier{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;
    font:800 11px/1 ui-sans-serif;color:#fff}
  .tA{background:#234a36}.tB{background:#3c714f}.tC{background:#b8893a}.tD{background:#9a8f78}

  /* wizard */
  .steps{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 26px}
  .step{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:10px;
    border:1px solid var(--line);background:#fff;font:600 12.5px/1 ui-sans-serif;color:var(--muted)}
  .step .n{width:20px;height:20px;border-radius:6px;background:var(--line);color:#fff;
    display:grid;place-items:center;font-size:11px}
  .step.on{border-color:var(--moss);color:var(--moss-700);background:var(--moss-100)}
  .step.on .n{background:var(--moss)}
  .step.done .n{background:var(--gold)}

  .drop{border:1.5px dashed #c4bba6;border-radius:12px;padding:34px;text-align:center;background:#fffef9}
  .drop.hot{border-color:var(--moss);background:var(--moss-100)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);font-size:13.5px}
  th{font:600 11px/1 ui-sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font:600 12px/1 ui-sans-serif;color:var(--muted);letter-spacing:.04em}
  .field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .tierbox{min-height:120px}
  .tierbox h4{margin:0 0 8px;font:700 12px/1 ui-sans-serif}
  .chip{display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:6px;font-size:12.5px}
  .chip select{border:0;background:var(--paper);border-radius:6px;padding:3px 5px;font-size:11px}
  .xbtn{border:1px solid var(--line);background:#fff;color:var(--clay);width:22px;height:22px;border-radius:6px;
    font:700 14px/1 ui-sans-serif;display:grid;place-items:center;margin-left:4px}
  .xbtn:hover{background:var(--clay-100);border-color:#e6c3ad}
  .linkbtn{background:none;border:0;color:var(--moss-700);font:600 12px/1 ui-sans-serif;
    text-decoration:underline;margin-left:8px;padding:0}
  .linkbtn:hover{color:var(--moss)}
  .mini{padding:3px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;font-family:ui-sans-serif}
  .mini.wide{width:100%;min-width:160px}
  .evsel{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 6px;font-size:12.5px;font-family:ui-sans-serif;max-width:180px}
  .delboard{align-self:flex-start;border:1px solid #e6c3ad;background:#fff;color:var(--clay);
    border-radius:8px;padding:6px 11px;font:600 12px/1 ui-sans-serif;white-space:nowrap}
  .delboard:hover{background:var(--clay-100)}

  /* boards */
  .board{break-inside:avoid;margin-bottom:18px}
  .bhead{display:flex;align-items:flex-start;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .bhead .id{font:800 13px/1 ui-sans-serif;letter-spacing:.06em;color:#fff;background:var(--moss);
    padding:8px 11px;border-radius:9px}
  .bmeta{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px;color:var(--muted);font:500 12.5px/1.2 ui-sans-serif}
  .evs{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;background:#fbf9f1;border-bottom:1px solid var(--line)}
  .ev{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px}
  .fam{font:600 11px/1 ui-sans-serif;color:var(--gold);letter-spacing:.1em;text-transform:uppercase}
  /* prominent date/time block on the right of the board header */
  .when{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end;
    background:var(--moss-100);border:1px solid #bcd3c3;border-radius:10px;padding:10px 16px;min-width:175px}
  .when .wdate{font:800 18px/1.2 ui-sans-serif;color:var(--moss-700)}
  .when .wtime{font:700 15px/1.2 ui-sans-serif;color:var(--moss)}
  .when .wroom{font:600 13px/1.2 ui-sans-serif;color:var(--muted)}
  /* big centered board name on the public portal */
  .bigboard{font:800 24px/1 ui-sans-serif;color:var(--moss-700);letter-spacing:.01em;
    position:absolute;left:50%;transform:translateX(-50%)}
  .bhead{position:relative}
  .delgrp{border:1px solid #e6c3ad;background:#fff;color:var(--clay);border-radius:6px;cursor:pointer;
    font:600 12px/1 ui-sans-serif;padding:5px 9px}
  .delgrp:hover{background:#fdf6f1}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .temp{border-color:#e6c3ad;background:#fdf6f1}
  .temp .id2{background:var(--clay)}
  .note{font:500 12px/1.4 ui-sans-serif;color:var(--muted)}
  .footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);text-align:center;
    font:500 13px/1.7 ui-sans-serif;color:var(--muted)}
  .footer a{color:var(--moss-700);text-decoration:none}
  .footer a:hover{text-decoration:underline}

  /* =========================================================
     PUBLIC PORTAL — redesigned board card
     ========================================================= */
  .pcard{overflow:hidden;margin-bottom:20px}
  /* (1)(2) compact header, strong title, date/time inline on the right */
  .phead{display:flex;align-items:center;gap:16px;padding:14px 20px;
    background:linear-gradient(135deg,var(--moss),var(--moss-700));color:#fff}
  .phead .ptitle{font:800 26px/1 ui-sans-serif;letter-spacing:.01em}
  .phead .pcells{font:600 12px/1 ui-sans-serif;color:#cfe3d6;letter-spacing:.04em;margin-top:5px}
  .phead .pwhen{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
  /* (8) date/time present but lighter & smaller than before */
  .phead .pwdate{font:800 16px/1.2 ui-sans-serif;color:#fff}
  .phead .pwtime{font:600 13px/1.2 ui-sans-serif;color:#d8e8de}
  .phead .pwroom{font:500 12px/1.2 ui-sans-serif;color:#bcd3c3}
  /* (3) evaluators as profile cards with avatars */
  .pevs{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:13px 20px;
    background:#fbf9f1;border-bottom:1px solid var(--line)}
  .pevs .lab{font:700 11px/1 ui-sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--moss-700)}
  .pev{display:flex;align-items:center;gap:9px;padding:7px 13px 7px 8px;border:1px solid #d7e0d8;
    border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(20,32,26,.05)}
  .pev .av{min-width:34px;height:30px;padding:0 6px;border-radius:999px;display:grid;place-items:center;flex:0 0 auto;
    background:linear-gradient(145deg,#3c714f,#234a36);color:#fff;font:800 11px/1 ui-sans-serif;letter-spacing:.02em}
  .pev .nm{font:700 14px/1.1 ui-sans-serif;color:var(--ink)}
  /* (4)(9) table: column widths, visible header row */
  .ptbl{width:100%;border-collapse:collapse;table-layout:fixed}
  .ptbl thead th{background:#efeadd;color:var(--moss-700);font:700 11px/1 ui-sans-serif;
    letter-spacing:.08em;text-transform:uppercase;padding:11px 14px;border-bottom:2px solid #d9d2c2;text-align:left}
  .ptbl td{padding:13px 14px;border-bottom:1px solid #ece6d8;vertical-align:top;font-size:14px}
  .ptbl col.c-num{width:42px}
  .ptbl col.c-type{width:96px}
  .ptbl col.c-title{width:auto}
  .ptbl col.c-stu{width:340px}
  /* (6) zebra striping + hover */
  .ptbl tbody tr:nth-child(even){background:#faf8f0}
  .ptbl tbody tr:hover{background:var(--moss-100)}
  .ptbl .rnum{font:800 14px/1 ui-sans-serif;color:var(--muted)}
  /* (5) clamp long titles to 2 lines, full text via title attr */
  .ptitle2{font:600 14px/1.4 ui-sans-serif;color:var(--ink);display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* (7) high-contrast type badges */
  .tbadge{display:inline-flex;align-items:center;font:800 11px/1 ui-sans-serif;letter-spacing:.03em;
    padding:5px 11px;border-radius:6px;text-transform:uppercase}
  .tbadge.t-thesis{background:var(--moss);color:#fff}
  .tbadge.t-project{background:#c4631f;color:#fff}
  /* (4) collapsible members */
  .members{font-size:13.5px;color:#55503f;line-height:1.5}
  .memtoggle{background:none;border:0;color:var(--moss-700);font:700 12.5px/1 ui-sans-serif;
    text-decoration:underline;cursor:pointer;padding:0}
  .memtoggle:hover{color:var(--moss)}
  /* board summary chips ("4 groups · 2T · 2P · 11 students · room") */
  .psum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 20px;
    border-bottom:1px solid var(--line);background:#fff}
  .pchip{display:inline-flex;align-items:center;gap:5px;font:700 12px/1 ui-sans-serif;
    padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#faf8f0;color:#55503f}
  .pchip.t{background:var(--moss-100);border-color:#bcd3c3;color:var(--moss-700)}
  .pchip.p{background:var(--clay-100);border-color:#e6c3ad;color:var(--clay)}
  .pchip.room{background:#fff;border-color:#bcd3c3;color:var(--moss-700);cursor:pointer}
  .pchip.room:active{background:var(--moss-100)}
  /* evaluators: collapsed one-line toggle on mobile, always-open pills on desktop */
  .pevs-toggle{display:none;width:100%;align-items:center;justify-content:space-between;
    background:none;border:0;padding:2px 0;min-height:44px;cursor:pointer;
    font:700 12px/1 ui-sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--moss-700)}
  .pevlist{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  /* students: count-first toggle on mobile, full list on desktop */
  .stucount{display:none;align-items:center;gap:6px;background:#faf8f0;border:1px solid var(--line);
    border-radius:999px;padding:8px 13px;min-height:40px;cursor:pointer;
    font:700 13px/1 ui-sans-serif;color:#55503f}
  .stunames{display:block}
  /* (10) mobile: full portal rework — compact header, sticky search, cards,
     collapsed evaluators/students, 44px touch targets, less clutter */
  @media (max-width:680px){
    /* compact top nav: single line, never wraps */
    .top .row{height:52px;gap:8px;flex-wrap:nowrap}
    .mark{font-size:13px;gap:8px;min-width:0}
    .mark>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mark .logo{width:30px;height:30px;flex:0 0 30px;border-radius:8px}
    .mark .logo svg{width:19px;height:19px}
    .mark small{display:none}
    .seg{padding:3px;flex:0 0 auto}
    .seg button{padding:8px 10px;font-size:11.5px;white-space:nowrap}
    .reset-full{display:none}
    .reset-mini{display:inline}
    /* board card header: stacked, board no. + date/time dominate */
    .phead{flex-direction:column;align-items:flex-start;gap:10px;padding:16px}
    .phead .ptitle{font-size:30px}
    .phead .pwhen{margin-left:0;text-align:left;align-items:flex-start;gap:3px}
    .phead .pwdate{font-size:19px}
    .phead .pwtime{font-size:15px;font-weight:800;color:#eaf3ec}
    .phead .pwroom{font-size:13px;font-weight:700;color:#eaf3ec}
    /* evaluators collapse to a tappable one-line summary */
    .pevs{padding:2px 16px;display:block}
    .pevs .lab{display:none}
    .pevs-toggle{display:flex}
    .pevlist{display:none;padding:2px 0 12px}
    .pevlist.open{display:flex}
    .pev{min-height:44px}
    /* groups: table rows become clean stacked cards, labels removed */
    .ptbl,.ptbl thead,.ptbl tbody,.ptbl tr,.ptbl td{display:block;width:100%}
    .ptbl thead{display:none}
    .ptbl col{display:none}
    .ptbl tbody tr{border:1px solid var(--line);border-radius:12px;margin:12px 14px;
      padding:14px 2px 8px;background:#fff;box-shadow:0 1px 3px rgba(20,32,26,.06)}
    .ptbl tbody tr:nth-child(even){background:#fff}
    .ptbl td{border-bottom:0;padding:2px 14px 8px}
    .ptbl td::before{content:none}
    .ptbl td[data-label="#"]{display:none}
    .ptitle2{display:block;-webkit-line-clamp:initial;overflow:visible;
      font-size:13.5px;line-height:1.45;word-break:break-word}
    /* students collapse to "👥 N students" */
    .stucount{display:inline-flex}
    .stunames{display:none;margin-top:8px}
    .stunames.open{display:block}
    /* search bar scrolls away with the page (not sticky); input gets its own
       full-width row, 44px touch targets */
    .search{margin:0 0 14px;gap:8px}
    .search .btn{min-height:40px;padding:8px 13px;font-size:13px}
    .search input{flex:1 1 100%;min-width:0;min-height:44px}
    .search select{min-height:44px}
    /* touch targets + breathing room */
    .btn{min-height:44px}
    .psum{padding:12px 16px;gap:7px}
    .pchip{min-height:36px}
    .pcard{margin-bottom:26px}
    .footer{font-size:12.5px}
  }
  .search{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .search input,.search select{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
  .search input{flex:1;min-width:220px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}
  .stat{display:flex;gap:7px;align-items:baseline}
  .stat b{font:700 20px/1 ui-sans-serif}
  .banner{background:var(--moss-100);border:1px solid #bcd3c3;border-radius:10px;padding:11px 14px;
    font:500 13px/1.4 ui-sans-serif;color:var(--moss-700);margin-bottom:16px}
  @media (max-width:780px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
  /* very narrow phones: drop the brand text, keep the logo */
  @media (max-width:420px){
    .mark>span:last-child{display:none}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useCallback, useEffect } = React;

/* =======================================================================
   SUPABASE  (hosting: publish writes here, public portal reads from here)
   ======================================================================= */
const SUPABASE_URL = "https://fwhwiayamururcpardcc.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3aHdpYXlhbXVydXJjcGFyZGNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MzczNTIsImV4cCI6MjA5ODUxMzM1Mn0.Jh5ucz0z9wPQYno3JUhzHjhsNYpsmoIryZ140DUnb10";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
// stable slug from a semester name, e.g. "Spring 2026" -> "spring-2026"
const slugify = (s) =>
  String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

/* =======================================================================
   ENGINE  (identical logic to engine/data.js + engine/engine.js)
   ======================================================================= */
const CELLS = { AIML:"Artificial Intelligence & Machine Learning", NLP:"Natural Language Processing",
  CV:"Computer Vision", BIO:"Bioinformatics", GREEN:"Green Computing & Communications",
  CYBER:"Cybersecurity & Blockchain", OR:"Operations Research" };
const CELL_SHORT = { AIML:"AI/ML", NLP:"NLP", CV:"CV", BIO:"Bio", GREEN:"Green", CYBER:"Cyber", OR:"OR" };
// "B01" -> "Board 1". Falls back to the raw id if it doesn't match.
const boardLabel = (id)=>{ const m=/^B0*(\d+)$/.exec(String(id||"")); return m?`Board ${m[1]}`:String(id||""); };
// Display name for a board: an admin-set custom name if present, else the default "Board N".
const boardName = (b)=> (b && b.name && b.name.trim()) ? b.name.trim() : boardLabel(b?.boardId);
// "Name (ID)" <-> {name, id} for editable student fields.
const parseStudent = (s)=>{ const str=String(s||""); const m=/^(.*)\((.*)\)\s*$/.exec(str.trim());
  return m ? {name:m[1].trim(), id:m[2].trim()} : {name:str.trim(), id:""}; };
const formatStudent = (name,id)=>{ const nm=String(name||"").trim(), sid=String(id||"").trim();
  return nm ? (sid?`${nm} (${sid})`:nm) : sid; };
// Pretty date: "2026-06-13" -> "Sat, 13 Jun 2026". Empty -> "TBA".
const fmtDate = (d)=>{ if(!d)return "TBA"; const dt=new Date(d+"T00:00:00"); if(isNaN(dt))return d;
  return dt.toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short",year:"numeric"}); };
// "CV" + "4T+0P" style combined cell+composition string.
const cellComp = (b)=> (b.cells&&b.cells.length ? b.cells.map(c=>CELL_SHORT[c]).join("+")
  : (FAMILIES.find(f=>f.id===b.family)?.name || "No groups yet")) + (b.composition?` · ${b.composition}`:"");

function similarity(a,b){
  if(!a||!b)return 0; if(a===b)return 1;
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_, i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return 1-dp[m][n]/Math.max(m,n);
}
function resolveFaculty(name){
  if(!name)return null;
  const norm=normalizeName(name);
  if(FACULTY_BY_NAME[norm])return FACULTY_BY_NAME[norm];
  let best=null,score=0;
  for(const f of FACULTY){const s=similarity(norm,normalizeName(f.name)); if(s>score){score=s;best=f;}}
  return score>=0.85?best:null;
}

  if(s.includes("cyber")||s.includes("blockchain"))return"CYBER";

}

function inferGroupCell(g){

    return {cell:g.cell,family:fam?fam.id:null,resolvedFrom:"sheet",reason:fam?null:"Cell has no family mapping."};

  const src=sup||co;

const _norm = (s)=>String(s??"").trim().toLowerCase().replace(/[^a-z]/g,"");
function findHeaderRow(rows){
  for(let i=0;i<Math.min(rows.length,6);i++){
    const cells=(rows[i]||[]).map(_norm);
    if(cells.includes("sn")&&cells.includes("id"))return i;
  }
  return 1;
}
function mapColumns(headerRow){
  const want={sn:["sn"],id:["id"],name:["name"],title:["title"],program:["program"],
    type:["thesisproject","thesis","project","type"],supervisor:["supervisorname","supervisor"],
    coSupervisor:["cosupervisorname","cosupervisor"],confirmed:["confirmed"],changes:["requiredchanges","changes"]};
  const map={};
  headerRow.forEach((label,idx)=>{
    const n=_norm(label); if(!n)return;
    for(const [key,keys] of Object.entries(want)){
      if(map[key]!=null)continue;
      if(keys.some(k=>n===k)||keys.some(k=>n.includes(k)))map[key]=idx;
    }
  });
  return map;
}
function addStudent(group,id,name){
  const sid=String(id??"").trim(), nm=String(name??"").trim();
  if(!sid&&!nm)return;
  group.students.push(nm?(sid?`${nm} (${sid})`:nm):sid);
}
function parseWorkbook(sheets,{onlyConfirmed=false}={}){
  const groups=[],warnings=[]; let seq=0;
  for(const sheet of sheets){
    const cellKey=cellFromSheetName(sheet.name);
    if(!cellKey){warnings.push(`Sheet "${sheet.name}" did not map to a known research cell — skipped.`);continue;}
    const rows=sheet.rows||[]; const hr=findHeaderRow(rows); const col=mapColumns(rows[hr]||[]);
    if(col.sn==null||col.id==null){warnings.push(`Sheet "${sheet.name}" has no SN/ID header — skipped.`);continue;}
    let cur=null;
    for(let r=hr+1;r<rows.length;r++){
      const row=rows[r]||[];
      const hasSN=row[col.sn]!==undefined&&String(row[col.sn]).trim()!=="";
      const hasStudent=(row[col.id]!==undefined&&String(row[col.id]).trim()!=="")||(row[col.name]!==undefined&&String(row[col.name]).trim()!=="");
      if(hasSN){
        if(cur)groups.push(cur); seq+=1;
        const rawType=String(row[col.type]??"").trim().toLowerCase();
        const type=rawType.includes("thesis")?"Thesis":rawType.includes("project")?"Project":"Thesis";
        const confirmed=col.confirmed!=null?String(row[col.confirmed]??"").trim().toLowerCase():"";
        cur={groupId:`${cellKey}-${String(seq).padStart(3,"0")}`,cell:cellKey,
          title:String(row[col.title]??"Untitled").trim(),type,
          program:String(row[col.program]??"").trim(),students:[],
          supervisor:String(row[col.supervisor]??"").trim(),
          coSupervisor:String(row[col.coSupervisor]??"").trim(),
          confirmed,requiredChanges:String(row[col.changes]??"").trim(),_sheet:sheet.name};
        addStudent(cur,row[col.id],row[col.name]);
      }else if(hasStudent&&cur){ addStudent(cur,row[col.id],row[col.name]); }
    }
    if(cur){groups.push(cur);cur=null;}
  }
  let result=groups;
  if(onlyConfirmed){
    const before=result.length;
    result=result.filter(g=>g.confirmed===""||g.confirmed==="yes");
    const d=before-result.length;
    if(d)warnings.push(`${d} unconfirmed group(s) excluded (Confirmed ≠ Yes).`);
  }
  return {groups:result,warnings};
}
function conflictIdsForGroup(g){
  const s=new Set(); const sup=resolveFaculty(g.supervisor), co=resolveFaculty(g.coSupervisor);
  if(sup)s.add(sup.id); if(co)s.add(co.id); return s;
}
function selectEvaluators(eligible,count,tierOf,rng){
  rng=rng||Math.random;
  const pickRand=(arr)=>arr.length?arr[Math.floor(rng()*arr.length)]:undefined;
  const byTier={A:[],B:[],C:[],D:[]};
  for(const f of eligible)(byTier[tierOf(f.id)]||=[]).push(f);
  if(count===2){
    for(const [s,j] of PAIRING_PRIORITY){
      const senior=pickRand(byTier[s]); if(!senior)continue;
      const junior=pickRand(byTier[j].filter(x=>x.id!==senior.id));
      if(senior&&junior) return {evaluators:[senior,junior],rule:`${s}+${j}`};
    }
    if(eligible.length>=2){ const first=pickRand(eligible); const second=pickRand(eligible.filter(x=>x.id!==first.id)); return {evaluators:[first,second],rule:"any+any"}; }
    return {evaluators:null};
  }
  const chosen=[];
  for(const t of ["A","B","C"]){ const p=pickRand(byTier[t]); if(p){chosen.push(p);break;} }
  const remaining=eligible.filter(f=>!chosen.find(c=>c.id===f.id));
  for(let i=remaining.length-1;i>0;i--){const k=Math.floor(rng()*(i+1));[remaining[i],remaining[k]]=[remaining[k],remaining[i]];}
  for(const f of remaining){ if(chosen.length>=count)break; chosen.push(f);}
  return chosen.length>=count? {evaluators:chosen.slice(0,count),rule:"mixed"}:{evaluators:null};
}
function chunk(a,n){const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
function randomGroupCode(rng){const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=ch[Math.floor((rng||Math.random)()*ch.length)];return "G-"+s;}

function pairingScore(rule){const o={"A+D":5,"B+D":4,"A+C":3,"B+C":2,"any+any":1,"mixed":1};return o[rule]||0;}
function preferredPatterns(size){
  if(size===5)return [[3,2],[2,3],[4,1],[5,0],[1,4]];
  if(size===4)return [[2,2],[3,1],[4,0],[1,3]];
  const half=Math.floor(size/2); const pats=[];
  for(let t=half;t<=size;t++)pats.push([t,size-t]);
  for(let t=half-1;t>=1;t--)pats.push([t,size-t]);
  return pats;
}
function isPreferredComposition(t,p){return preferredPatterns(t+p).some(([pt,pp])=>pt===t&&pp===p);}
function packByComposition(groups,size){
  const total=groups.length;
  if(total===0)return [];
  const thesis=groups.filter(g=>g.type==="Thesis");
  const project=groups.filter(g=>g.type!=="Thesis");
  // Board count: aim for `size`/board but NEVER below 4 groups on any board.
  // maxBoards = floor(total/4) guarantees every board gets ≥4; one slightly
  // oversized board beats any 2–3 group board. total<4 -> one flagged board.
  const MIN_BOARD=4;
  const maxBoards=Math.max(1,Math.floor(total/MIN_BOARD));
  const boardCount=Math.min(Math.max(1,Math.round(total/size)),maxBoards);
  const caps=Array.from({length:boardCount},()=>Math.floor(total/boardCount));
  for(let i=0;i<total%boardCount;i++)caps[i]+=1;
  const boards=[]; let remT=thesis.length, remP=project.length;
  for(const cap of caps){
    let chosen=null;
    for(const [needT,needP] of preferredPatterns(cap)){
      if(needT<=remT&&needP<=remP){chosen=[needT,needP];break;}
    }
    if(!chosen){ const t=Math.min(cap,remT); const p=Math.min(cap-t,remP); chosen=[t,p]; }
    const [takeT,takeP]=chosen;
    boards.push([...thesis.splice(0,takeT),...project.splice(0,takeP)]);
    remT-=takeT; remP-=takeP;
  }
  // Safety net: place stragglers on the smallest board; NEVER open a new
  // board (a fresh 1-group board would violate the 4-group minimum).
  const leftover=[...thesis,...project];
  for(const g of leftover){
    boards.sort((a,b)=>a.length-b.length);
    const target=boards.find(b=>b.length<size+1)||boards[0];
    target.push(g);
  }
  return boards;
}

// Same board-count/size logic as packByComposition (never below MIN_BOARD
// groups on a board), but applied to ONE type at a time so a board never
// receives both. Used when config.separateByType is on — the "only Thesis
// or only Project per board" rule.
function packSingleType(list,size){
  const total=list.length;
  if(total===0)return [];
  const MIN_BOARD=4;
  const maxBoards=Math.max(1,Math.floor(total/MIN_BOARD));
  const boardCount=Math.min(Math.max(1,Math.round(total/size)),maxBoards);
  const caps=Array.from({length:boardCount},()=>Math.floor(total/boardCount));
  for(let i=0;i<total%boardCount;i++)caps[i]+=1;
  const pool=list.slice();
  const boards=caps.map(cap=>pool.splice(0,cap));
  // Safety net (should be a no-op — caps always sum to total).
  for(const g of pool){
    boards.sort((a,b)=>a.length-b.length);
    const target=boards.find(b=>b.length<size+1)||boards[0];
    target.push(g);
  }
  return boards;
}
function packSeparateByType(groups,size){
  const thesis=groups.filter(g=>g.type==="Thesis");
  const project=groups.filter(g=>g.type!=="Thesis");
  return [...packSingleType(thesis,size),...packSingleType(project,size)];
}

function generateBoards(groups,config){
  const {targetGroupCount=4,evaluatorCount=2,slots=[{id:"S1",label:"Slot 1"}],facultyTierOverrides={},faculty=FACULTY,seed=Date.now(),separateByType=false}=config;
  const rng=mulberry32(seed>>>0);
  const shuffle=(arr)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const facultyById=Object.fromEntries(faculty.map(f=>[f.id,f]));
  const tierOf=(fid)=> Object.prototype.hasOwnProperty.call(facultyTierOverrides,fid)
    ? facultyTierOverrides[fid] : (facultyById[fid]?.tier ?? null);
  const temporary=[]; const resolved=[];
  for(const g of groups){
    const info=inferGroupCell(g);
    if(!info.family){ temporary.push({group:g,reason:info.reason}); continue; }
    resolved.push({...g,_cell:info.cell,_family:info.family,_conflicts:conflictIdsForGroup(g)});
  }
  const byFamily={}; for(const g of resolved)(byFamily[g._family]||=[]).push(g);
  const usedInSlot={}; for(const s of slots)usedInSlot[s.id]=new Set();
  const boards=[]; let seq=0;
  for(const [familyId,famGroups] of Object.entries(byFamily)){
    const cellBuckets={}; for(const g of famGroups)(cellBuckets[g._cell]||=[]).push(g);
    const shuffledFam=shuffle(Object.keys(cellBuckets)).flatMap(c=>shuffle(cellBuckets[c]));
    const chunks=separateByType?packSeparateByType(shuffledFam,targetGroupCount):packByComposition(shuffledFam,targetGroupCount);
    const famFaculty=faculty.filter(f=>{const fa=familyOfCell(f.cell);return fa&&fa.id===familyId&&tierOf(f.id);});
    const orderedChunks=chunks.map(gs=>{
      const conf=new Set(); for(const g of gs)for(const id of g._conflicts)conf.add(id);
      return {gs,headroom:famFaculty.filter(f=>!conf.has(f.id)).length};
    }).sort((a,b)=>a.headroom-b.headroom).map(x=>x.gs);
    for(const groupsForBoard of orderedChunks){
      seq+=1;
      const conflicted=new Set(); for(const g of groupsForBoard)for(const id of g._conflicts)conflicted.add(id);
      let best=null;
      for(const slot of slots){
        const eligible=famFaculty.filter(f=>!conflicted.has(f.id)&&!usedInSlot[slot.id].has(f.id));
        const pick=selectEvaluators(eligible,evaluatorCount,tierOf,rng);
        const ok=pick.evaluators&&pick.evaluators.length>=evaluatorCount;
        const score=(ok?1000:0)+pairingScore(pick.rule)+eligible.length;
        if(!best||score>best.score)best={slot,pick,ok,score};
      }
      const slot=best.slot, pick=best.pick;
      if(!best.ok){
        for(const g of groupsForBoard) temporary.push({group:g,reason:`No valid ${evaluatorCount}-evaluator panel available in family ${familyId} in any slot after COI + slot rules.`});
        continue;
      }
      for(const ev of pick.evaluators)usedInSlot[slot.id].add(ev.id);
      const tCount=groupsForBoard.filter(g=>g.type==="Thesis").length;
      const pCount=groupsForBoard.filter(g=>g.type!=="Thesis").length;
      boards.push({
        boardId:`B${String(seq).padStart(2,"0")}`, family:familyId,
        cells:[...new Set(groupsForBoard.map(g=>g._cell))], slot, date:null, room:null,
        composition:`${tCount}T+${pCount}P`,
        compositionOk: separateByType ? (tCount===0||pCount===0) : isPreferredComposition(tCount,pCount),
        sizeNote:(groupsForBoard.length<4 ? `only ${groupsForBoard.length} group(s) — family pool too small`
          : groupsForBoard.length>targetGroupCount+1 ? `oversized (${groupsForBoard.length} groups)` : null),
        evaluators:pick.evaluators.map(e=>({id:e.id,name:e.name,designation:e.designation,cell:e.cell,code:e.code,tier:tierOf(e.id)})),
        pairingRule:pick.rule,
        groups:groupsForBoard.map(g=>({groupId:g.groupId,publicId:randomGroupCode(rng),title:g.title,type:g.type,students:g.students,supervisor:g.supervisor,coSupervisor:g.coSupervisor,cell:g._cell})),
      });
    }
  }
  return {boards,temporary,separateByType};
}
